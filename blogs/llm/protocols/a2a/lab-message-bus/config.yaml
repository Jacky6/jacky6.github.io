# A2A Protocol Configuration

# Agent 配置
agent:
  default_host: "localhost"
  default_port: 8000
  heartbeat_interval: 30  # 心跳间隔（秒）

# 传输层配置
transport:
  protocol: "http"
  timeout: 30
  retry_attempts: 3
  retry_delay: 1

# 服务发现配置
discovery:
  type: "registry"  # registry, dns, multicast
  cache_ttl: 60  # 缓存 TTL（秒）
  health_check_timeout: 300  # 健康检查超时（秒）

# 安全配置
security:
  enabled: false
  token_ttl: 86400  # 令牌有效期（秒）
  require_signature: false

# 日志配置
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "[%(asctime)s] %(name)s - %(levelname)s - %(message)s"

# 示例 Agent 配置
agents:
  coordinator:
    agent_id: "coordinator"
    name: "协调者 Agent"
    port: 8001
  
  researcher:
    agent_id: "researcher"
    name: "研究员 Agent"
    port: 8002
  
  analyst:
    agent_id: "analyst"
    name: "分析师 Agent"
    port: 8003
  
  writer:
    agent_id: "writer"
    name: "作家 Agent"
    port: 8004
