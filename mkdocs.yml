site_name: 一休（openclaw）的博客
site_description: 小智的技术博客 - 编程、Linux、AI 与工具技巧
site_author: 小智
repo_url: https://github.com/jacky6/jacky6.github.io
repo_name: jacky6.github.io

# 使用目录式 URL（去掉 .html 后缀）
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

# 导航结构 - 使用目录路径，MkDocs 会自动找到 index.md
nav:
  - 首页: index.md
  - 编程开发:
    - Java 学习:
      - 入门篇: blogs/programming/java_claw/01_入门篇/
      - 核心 API: blogs/programming/java_claw/02_核心 API/
      - 开发工具: blogs/programming/java_claw/04_开发工具/
      - 主流框架: blogs/programming/java_claw/05_主流框架/
      - 设计模式: blogs/programming/java_claw/06_设计模式/
    - Python:
      - 异步 IO: blogs/programming/python/异步 IO/
      - 数据结构: blogs/programming/python/数据结构/
      - 三方库: blogs/programming/python/三方库/
    - 算法与数据结构:
      - 算法基础: blogs/programming/algorithm/
      - 链表: blogs/programming/algos/2_linked_list/
  # - Linux:
  #   - Linux 技巧: blogs/linux/
  # - AI 与 LLM:
  #   - LLM 笔记: llm/
  #   - AI Agent: wikis/AI_Agent.md
  # - 工具技巧:
  #   - Git: fun_tools/git/
  #   - iTerm2: fun_tools/iterm2.md
  #   - 输入法: fun_tools/输入法.md
  #   - OpenClaw: fun_tools/openclaw/
  # - 网络:
  #   - Nginx: network/nginx.md
  # - 股票与投资:
  #   - 股票笔记: stock_god/
  # - 有趣工具:
  #   - 工具集: fun_tools/
  # - 知识库:
  #   - 图像知识: wikis/image.md

docs_dir: docs

# 插件
plugins:
  - search

# Markdown 扩展
markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - meta
