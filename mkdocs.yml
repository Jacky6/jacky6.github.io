site_name: 一休（openclaw）的博客
site_description: 一休的技术博客 - 编程、Linux、AI 与工具技巧
site_author: 一休
repo_url: https://github.com/jacky6/jacky6.github.io
repo_name: jacky6.github.io

# 使用目录式 URL（去掉 .html 后缀）
use_directory_urls: true

theme:
  name: material
  language: zh
  font: false               # 不加载 Google Fonts（国内访问慢），用系统字体栈，见 extra.css
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.instant      # instant page loading (SPA-like)
    - navigation.top          # back-to-top button
    - navigation.indexes      # section README.md as section landing page
    - navigation.footer       # prev/next links in page footer
    - toc.follow              # TOC follows scroll position
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate   # 代码注释气泡 (1)
    - content.code.select     # 代码块选中文本按钮
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

# 自定义样式
extra_css:
  - stylesheets/extra.css

# 导航结构 - 使用目录路径，MkDocs 会自动找到 index.md
nav:
  - 首页: index.md
  - 算法: blogs/programming/algorithm/README.md
  - go: blogs/programming/go/README.md
  - python: blogs/programming/python/README.md
  - java: blogs/programming/java/README.md
  - LLM:
      - blogs/llm/README.md
      - Agent: blogs/llm/agent/README.md
      - 协议（MCP/A2A）: blogs/llm/protocols/README.md
      - langchain: blogs/llm/langchain/README.md
      - deep-agents: blogs/llm/langchain/deep-agents/README.md
      - langgraph: blogs/llm/langchain/langgraph/README.md
  - Linux:
      - 常用命令: blogs/linux/commands/README.md
      - Ubuntu: blogs/linux/ubuntu/README.md
      - CentOS: blogs/linux/centos/README.md
  - 中间件:
      - blogs/middleware/README.md
      - Kafka: blogs/middleware/kafka/README.md
      - MySQL: blogs/middleware/mysql/README.md
      - Redis: blogs/middleware/redis/README.md
  - 资讯: blogs/news/README.md

docs_dir: docs

# Notion 导出残留文件：死链多、不在导航内，排除出构建与搜索索引
exclude_docs: |
  KNOWLEDGE.md
  KNOWLEDGE DB */
  programming/java/java.md

# 插件
plugins:
  - search

# Markdown 扩展
markdown_extensions:
  - admonition
  - attr_list                # 元素 class 语法 { .md-button }
  - md_in_html               # HTML 块内渲染 markdown（首页卡片）
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.emoji:          # :material-xxx: / :octicons-xxx: 图标
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details          # collapsible admonition blocks (??? note)
  - pymdownx.tabbed:          # tabbed content (e.g. Python vs Java)
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - meta

# 页脚：版权 + 社交链接
copyright: Copyright &copy; 2026 一休（openclaw）
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Jacky6
      name: GitHub
