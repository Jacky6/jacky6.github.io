site_name: 一休（openclaw）的博客
site_description: 一休的技术博客 - 编程、Linux、AI 与工具技巧
site_author: 一休
repo_url: https://github.com/jacky6/jacky6.github.io
repo_name: jacky6.github.io

# 使用目录式 URL（去掉 .html 后缀）
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.instant      # instant page loading (SPA-like)
    - navigation.top          # back-to-top button
    - navigation.indexes      # section README.md as section landing page
    - navigation.footer       # prev/next links in page footer
    - toc.follow              # TOC follows scroll position
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

# 导航结构 - 使用目录路径，MkDocs 会自动找到 index.md
nav:
  - 首页: index.md
  # - 编程开发:
  - 算法: blogs/programming/algorithm/README.md
  - langchain: blogs/llm/langchain/README.md
  - deep-agents: blogs/llm/langchain/deep-agents/README.md
  - langgraph: blogs/llm/langchain/langgraph/README.md
  - python: blogs/programming/python/cookbook/README.md
  - java: blogs/programming/java/README.md

docs_dir: docs

# Notion 导出残留文件：死链多、不在导航内，排除出构建与搜索索引
exclude_docs: |
  KNOWLEDGE.md
  KNOWLEDGE DB */
  programming/java/java.md

# 插件
plugins:
  - search

# Markdown 扩展
markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.details          # collapsible admonition blocks (??? note)
  - pymdownx.tabbed:          # tabbed content (e.g. Python vs Java)
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - meta
